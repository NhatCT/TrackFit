name: CI — Test & Build Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  # ---------- Cổng chất lượng: chạy test trước khi build ----------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend unit tests
        working-directory: ./TrackFitApp
        run: mvn -B -q test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: trackfitweb/package-lock.json
      - name: Install & test
        working-directory: ./trackfitweb
        env:
          CI: "true"
        run: |
          npm ci
          npm test -- --watchAll=false --passWithNoTests

  # ---------- Build & push cả 3 image, gắn tag theo commit SHA ----------
  build-push:
    needs: [ test-backend, test-frontend ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ai
            context: ./ai-reco
            dockerfile: ./ai-reco/Dockerfile
            image: trackfit-ai
          - name: backend
            context: ./TrackFitApp
            dockerfile: ./TrackFitApp/Dockerfile
            image: trackfit-backend
          - name: frontend
            context: ./trackfitweb
            dockerfile: ./trackfitweb/Dockerfile
            image: trackfit-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:cache,mode=max
